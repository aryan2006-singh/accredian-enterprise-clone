services:
  - type: web
    name: accredian-enterprise-clone
    runtime: node
    plan: free
    branch: feature/ascentra-landing-page
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    healthCheckPath: /
